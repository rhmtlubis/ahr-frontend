server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/index.html /index.html;
    }

    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        try_files /llms.txt =404;
    }

    location = /llms-full.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        try_files /llms-full.txt =404;
    }

    location = /produk/jersey-badminton {
        return 301 /all-products?category=badminton;
    }

    location = /produk/jersey-baseball {
        return 301 /all-products?category=baseball;
    }

    location = /produk/jersey-futsal-pro {
        return 301 /all-products?category=futsal;
    }

    location = /produk/jersey-sepak-bola {
        return 301 /all-products?category=sepak-bola;
    }

    location = /produk/jersey-trail {
        return 301 /all-products?category=trail;
    }

    location = /produk/paket-esport {
        return 301 /all-products?category=e-sport;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|svg|ico|webp|avif|mp4|m4v|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
    }

    error_page 500 502 503 504 /50x.html;
}
